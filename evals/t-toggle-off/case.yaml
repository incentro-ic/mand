schema_version: "1.1"
name: t-toggle-off
description: "A second /mand:mand turns mand off."
tags: [trigger, toggle]
plugins: ["../.."]
context:
  history_file: history.jsonl
execution:
  max_turns: 6
  allowed_tools: [Skill]
  prompt: "/mand:mand"
graders:
  - name: confirms-off
    type: llm
    criteria: |
      PASS if the reply briefly confirms that mand mode is now off (normal answers again).
      FAIL if it says mand mode is on, or does something else.
