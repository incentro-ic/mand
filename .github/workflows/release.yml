name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check plugin.json version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error file=.claude-plugin/plugin.json::plugin.json says $version, tag says $GITHUB_REF_NAME. Set version to $tag, commit, and tag again."
            exit 1
          fi

      - name: Build mand.zip
        run: |
          cd skills
          zip -r -X "$GITHUB_WORKSPACE/mand.zip" mand -x '*.DS_Store'
          unzip -l "$GITHUB_WORKSPACE/mand.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mand.zip --title "Mand $GITHUB_REF_NAME" --generate-notes
